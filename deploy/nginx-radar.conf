# Конфигурация nginx для сайта и кабинета.
#
# Что подставить своё — три места, все помечены угловыми скобками. Скобки убираются
# вместе с текстом внутри: было <домен>, стало example.ru.
#
# Как поставить на сервер (команды выполняет человек, не агент):
#   1. Скопировать этот файл на сервер в /etc/nginx/sites-available/radar
#   2. Включить его: ln -s /etc/nginx/sites-available/radar /etc/nginx/sites-enabled/radar
#   3. Проверить синтаксис: nginx -t
#   4. Применить: systemctl reload nginx
#
# HTTPS этот файл не настраивает — его допишет certbot в главе 7 урока, сам, на этом же
# файле: добавит блок на 443 порт и строки с путями к сертификату. Здесь заранее ничего
# для HTTPS прописывать не нужно.

server {
    listen 80;

    # Домен, на который куплена A-запись. Можно указать два имени через пробел:
    # <домен> www.<домен> — тогда сайт откроется и с www, и без него.
    server_name <домен>;

    location / {
        # Приложение слушает только локальный адрес: снаружи к нему напрямую не
        # подключиться, все запросы идут через nginx. Порт тот же, что в юните
        # radar-site.service — если меняете там, поменяйте и здесь.
        proxy_pass http://127.0.0.1:8000;

        # Без этих строк приложение видит все запросы как пришедшие от самого сервера:
        # в логах вместо адреса посетителя будет 127.0.0.1, а ссылки, которые строит
        # приложение, могут получиться с неверным адресом.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
